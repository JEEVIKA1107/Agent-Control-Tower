name: Agent Control Tower CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Test & Build Production Bundle
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install --prefix backend
          npm install --prefix frontend

      - name: Run Backend Test Harness (10 suites, 70 tests)
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/agent_control_tower_test
          JWT_SECRET: ci_cd_pipeline_super_secret_test_jwt_key_2026
        run: npm test --prefix backend

      - name: Build Frontend Production SPA
        run: npm run build --prefix frontend

      - name: Verify Production Distribution Artifacts
        run: |
          test -f frontend/dist/index.html || { echo "Missing index.html"; exit 1; }
          echo "Production frontend bundle verified successfully."

  deploy:
    name: Continuous Deployment Trigger
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Production Deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering automated deployment webhook on Render..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered successfully."

      - name: Continuous Deployment Status
        run: |
          echo "CI/CD Pipeline checks completed. Connected cloud platforms (Render / Vercel / Railway) will auto-deploy the latest commit."
